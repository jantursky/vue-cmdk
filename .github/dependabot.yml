version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR a week for the tooling, so CI runs once instead of per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The peer range is the public contract; widen or raise it by hand.
      - dependency-name: vue
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
