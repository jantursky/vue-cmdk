name: Release

# Pushing a tag such as `v1.1.0` publishes that version to npm with provenance,
# then creates the GitHub release with the matching changelog section.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Trusted publishing: npm exchanges this OIDC token for a short-lived publish token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Check the tag matches package.json
        working-directory: packages/vue-cmdk
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Install browsers for prepublishOnly
        run: bunx playwright install --with-deps chromium firefox webkit
      # prepublishOnly runs the typecheck, both test suites, the build and the package checks.
      - name: Publish
        working-directory: packages/vue-cmdk
        run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' packages/vue-cmdk/CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
