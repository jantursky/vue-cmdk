name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Vitest's V8 coverage needs Node; `bun run` hands the tool binaries to it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test with coverage
        run: bun run test:coverage
      - name: Test in real browsers
        run: |
          bunx playwright install --with-deps chromium firefox webkit
          bun run test:browser
      - name: Build (library size budget and demo)
        run: bun run build
      - name: Check the package (publint, types for import and require)
        run: bun run lint:package
      - name: Build docs
        run: bun run build:docs
